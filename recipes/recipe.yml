# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: kinoite-nvidia-open-hardened-bcachefs
# description will be included in the image's metadata
description: This is my personal OS image with bcachefs.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/secureblue/kinoite-nvidia-open-hardened
image-version: latest # You can pin to a specific version of Fedora as well

stages:
  - name: bcachefs
    from: ghcr.io/secureblue/kinoite-nvidia-open-hardened:latest
    modules:
      - type: script
        scripts:
          - bcachefs.sh

modules:
  - type: copy
    from: bcachefs
    src: /tmp/rpms/output/
    dest: /tmp/bcachefs-rpms/
  - type: dnf
    install:
      packages:
        - micro
        - bcachefs-tools
        - /tmp/bcachefs-rpms/*.rpm
    remove:
      packages:
        - firefox
        - firefox-langpacks
  - type: signing
