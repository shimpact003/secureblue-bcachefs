# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: kinoite-nvidia-open-hardened-bcachefs
# description will be included in the image's metadata
description: This is my personal OS image with bcachefs.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/secureblue/kinoite-nvidia-open-hardened
image-version: latest # You can pin to a specific version of Fedora as well


stages:
  - name: bcachefs-kmod
    from: fedora:latest
    modules:
      - type: copy
        src: files/rpms
        dest: /tmp/rpms/

      - type: script
        snippets:
          - |
            set -euo pipefail

            dnf install -y \
              dnf-plugins-core rpm-build cpio tar gcc make kmodtool

            mkdir -p /tmp/bcachefs-source /tmp/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
            cd /tmp/bcachefs-source

            dnf download --source --destdir . bcachefs-tools
            rpm2cpio bcachefs-tools-*.src.rpm | cpio -idm

            VERSION=$(rpm -qp --qf '%{VERSION}' bcachefs-tools-*.src.rpm)
            SOURCE=$(find . -maxdepth 1 -name '*.tar.zst' -print -quit)
            SOURCE_NAME=${SOURCE##*/}
            TOPDIR=$(tar -tf "$SOURCE" | head -n1 | cut -d/ -f1)

            sed \
              -e "s|@VERSION@|$VERSION|g" \
              -e "s|@SOURCE0@|$SOURCE_NAME|g" \
              -e "s|@TOPDIR@|$TOPDIR|g" \
              /tmp/rpms/bcachefs-kmod.spec.in \
              > /tmp/rpmbuild/SPECS/bcachefs-kmod.spec

            cp "$SOURCE" /tmp/rpmbuild/SOURCES/

            # Build akmod RPM
            rpmbuild -ba \
              --define "_topdir /tmp/rpmbuild" \
              /tmp/rpmbuild/SPECS/bcachefs-kmod.spec
            mkdir -p /tmp/rpms/output
            find /tmp/rpmbuild/RPMS -name '*.rpm' -exec cp {} /tmp/rpms/output/ \;

modules:
  - type: copy
    from: bcachefs-kmod
    src: /tmp/rpms/output/
    dest: /tmp/bcachefs-rpms/
  - type: rpm-ostree
    install:
      - micro
      - bcachefs-tools
    remove:
      - firefox
      - firefox-langpacks
  - type: script
    snippets:
      - |
        set -euo pipefail
        rpm-ostree install /tmp/bcachefs-rpms/*.rpm
  - type: signing
